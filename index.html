<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nahbro.site</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        #tiltContainer {
            perspective: 1000px;
            width: 90%;
            max-width: 600px;
        }
        #tiltCard {
            width: 100%;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }
        #tiltCard img {
            width: 100%;
            display: block;
            border-top: 1px solid #00f2ff;
            border-bottom: 1px solid #00f2ff;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
        }
        #accelBtn {
            position: absolute;
            bottom: 30px;
            background: none;
            border: 1px solid #00f2ff;
            color: #00f2ff;
            padding: 12px 24px;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 100;
            transition: 0.3s;
        }
        #accelBtn:hover {
            background: rgba(0, 242, 255, 0.1);
            box-shadow: 0 0 15px #00f2ff;
        }
    </style>
</head>
<body>

    <div id="tiltContainer">
        <div id="tiltCard">
            <img src="designv1.png" alt="cheat menu">
        </div>
    </div>

    <button id="accelBtn">[ INITIALIZE SENSORS ]</button>

    <script>
        const card = document.getElementById('tiltCard');
        const container = document.getElementById('tiltContainer');
        const btn = document.getElementById('accelBtn');

        let mouseX = 0, mouseY = 0;
        let currentRotateX = 0, currentRotateY = 0;
        const tiltIntensity = 15;
        const smoothness = 0.08;

        function handleOrientation(e) {
            let x = e.gamma / 30;
            let y = (e.beta - 45) / 30;
            x = Math.max(Math.min(x, 1), -1);
            y = Math.max(Math.min(y, 1), -1);
            mouseX = x * tiltIntensity;
            mouseY = -y * tiltIntensity;
        }

        async function requestTOS() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                        btn.style.display = 'none';
                    }
                } catch (e) {
                    console.error(e);
                }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                btn.style.display = 'none';
            }
        }

        btn.addEventListener('click', requestTOS);

        container.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width * 2 - 1;
            const y = (e.clientY - rect.top) / rect.height * 2 - 1;
            mouseX = x * tiltIntensity;
            mouseY = -y * tiltIntensity;
        });

        function animate() {
            currentRotateX += (mouseY - currentRotateX) * smoothness;
            currentRotateY += (mouseX - currentRotateY) * smoothness;
            card.style.transform = `rotateX(${currentRotateX}deg) rotateY(${currentRotateY}deg)`;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>

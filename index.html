<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nahbro.site — Coming Soon</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --accent-color: #ffffff;
            --text-color: #ffffff;
            --main-font: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--main-font);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .coming-soon-text {
            font-size: 2.5rem;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 50px;
            text-shadow: 0 0 10px var(--accent-color);
            letter-spacing: 5px;
            animation: glitch 3s infinite;
            pointer-events: none; /* Щоб не перехоплював мишку */
            user-select: none;
        }

        /* КОНТЕЙНЕР тепер займає тільки місце картинки */
        .card-container {
            perspective: 1000px;
            display: inline-block; 
            padding: 20px; /* Буферна зона для плавності */
        }

        .card {
            width: 800px; /* Трохи зменшив, щоб влізало в екран */
            max-width: 90vw; 
            height: auto;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
            will-change: transform;
            transform-style: preserve-3d;
            border: 2px solid #222;
            cursor: pointer;
        }

        .card img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
        }

        .card:hover {
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            border-color: var(--accent-color);
        }

        @keyframes glitch {
            0% { transform: translate(0); text-shadow: 0 0 10px var(--accent-color); }
            20% { transform: translate(-2px, 2px); text-shadow: 2px 0 red, -2px 0 blue; }
            40% { transform: translate(2px, -2px); }
            60% { transform: translate(-2px, -2px); }
            80% { transform: translate(2px, 2px); }
            100% { transform: translate(0); text-shadow: 0 0 10px var(--accent-color); }
        }
    </style>
</head>
<body>

    <div class="coming-soon-text">coming soon...</div>

    <div class="card-container" id="tiltContainer">
        <div class="card" id="tiltCard">
            <img src="designv1.png" alt="nahbro design v1">
        </div>
    </div>

    <script>
    const container = document.getElementById('tiltContainer');
    const card = document.getElementById('tiltCard');

    let mouseX = 0;
    let mouseY = 0;
    let currentRotateX = 0;
    let currentRotateY = 0;
    let isHovering = false;

    // Чутливість нахилу (градуси)
    const tiltIntensity = 12; 
    // Плавність (чим менше число, тим повільніше наздоганяє мишку, наприклад 0.05)
    const smoothness = 0.08; 

    container.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        
        // Координати відносно центру картки (-1 до 1)
        const x = (e.clientX - rect.left) / rect.width * 2 - 1;
        const y = (e.clientY - rect.top) / rect.height * 2 - 1;

        mouseX = x * tiltIntensity;
        mouseY = -y * tiltIntensity;
    });

    container.addEventListener('mouseenter', () => {
        isHovering = true;
    });

    container.addEventListener('mouseleave', () => {
        isHovering = false;
        mouseX = 0;
        mouseY = 0;
    });

    // Головний цикл анімації для максимальної плавності
    function animate() {
        // Формула плавності: поточне значення + (ціль - поточне) * коефіцієнт
        currentRotateX += (mouseY - currentRotateX) * smoothness;
        currentRotateY += (mouseX - currentRotateY) * smoothness;

        // Масштабування при наведенні
        const scale = isHovering ? 1.03 : 1;

        card.style.transform = `rotateX(${currentRotateX}deg) rotateY(${currentRotateY}deg) scale(${scale})`;
        
        requestAnimationFrame(animate);
    }

    // Запускаємо рендер
    animate();
</script>

</body>
</html>

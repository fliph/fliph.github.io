<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nahbro.site - Coming Soon</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --accent-color: #ffffff;
            --text-color: #ffffff;
            --main-font: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--main-font);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .coming-soon-text {
            font-size: 2.5rem;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 50px;
            text-shadow: 0 0 10px var(--accent-color);
            letter-spacing: 5px;
            animation: glitch 3s infinite;
            pointer-events: none; 
            user-select: none;
        }

    
        .card-container {
            perspective: 1000px;
            display: inline-block; 
            padding: 20px; /
        }

        .card {
            width: 800px; 
            max-width: 90vw; 
            height: auto;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
            will-change: transform;
            transform-style: preserve-3d;
            border: 2px solid #222;
            cursor: pointer;
        }

        .card img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
        }

        .card:hover {
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            border-color: var(--accent-color);
        }

        @keyframes glitch {
            0% { transform: translate(0); text-shadow: 0 0 10px var(--accent-color); }
            20% { transform: translate(-2px, 2px); text-shadow: 2px 0 red, -2px 0 blue; }
            40% { transform: translate(2px, -2px); }
            60% { transform: translate(-2px, -2px); }
            80% { transform: translate(2px, 2px); }
            100% { transform: translate(0); text-shadow: 0 0 10px var(--accent-color); }
        }
    </style>
</head>
<body>

    <div class="coming-soon-text">coming soon...</div>

    <div class="card-container" id="tiltContainer">
        <div class="card" id="tiltCard">
            <img src="designv1.png" alt="nahbro design v1">
        </div>
    </div>

<script>
    const card = document.getElementById('tiltCard');
    const container = document.getElementById('tiltContainer');

    let mouseX = 0, mouseY = 0;
    let currentRotateX = 0, currentRotateY = 0;
    const tiltIntensity = 15; 
    const smoothness = 0.08;

    async function requestPermission() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                const response = await DeviceOrientationEvent.requestPermission();
                if (response === 'granted') {
                    window.addEventListener('deviceorientation', handleOrientation);
                }
            } catch (error) {
                console.error("", error);
            }
        } else {
            window.addEventListener('deviceorientation', handleOrientation);
        }
        window.removeEventListener('click', requestPermission);
    }

    // Слухаємо перший клік по екрану, щоб активувати гіроскоп
    window.addEventListener('click', requestPermission);

    function handleOrientation(e) {
        let x = e.gamma / 30; 
        let y = (e.beta - 45) / 30; 

        x = Math.max(Math.min(x, 1), -1);
        y = Math.max(Math.min(y, 1), -1);

        mouseX = x * tiltIntensity;
        mouseY = -y * tiltIntensity;
    }

    container.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width * 2 - 1;
        const y = (e.clientY - rect.top) / rect.height * 2 - 1;
        mouseX = x * tiltIntensity;
        mouseY = -y * tiltIntensity;
    });

    function animate() {
        currentRotateX += (mouseY - currentRotateX) * smoothness;
        currentRotateY += (mouseX - currentRotateY) * smoothness;
        card.style.transform = `perspective(1000px) rotateX(${currentRotateX}deg) rotateY(${currentRotateY}deg)`;
        requestAnimationFrame(animate);
    }

    animate();
</script>

</body>

</html>
